<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Kodlås</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }

        input {
            padding: 10px;
            font-size: 18px;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
        }

        #resultat {
            margin-top: 20px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>Skriv in kod</h1>

    <input type="password" id="kod" placeholder="Kod">
    <br><br>

    <button onclick="kontrolleraKod()">Öppna</button>

    <p id="resultat"></p>

    <script>
        function kontrolleraKod() {
            const rättKod = "2598426";
            const användarKod = document.getElementById("kod").value;

            if (användarKod === rättKod) {
                window.location.href = "https://windskore.se/brukshundsklubb";
            } else {
                document.getElementById("resultat").innerHTML =
                "❌ Fel kod!";
            }
        }
    </script>

</body>
</html>
